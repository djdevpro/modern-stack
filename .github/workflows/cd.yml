# CD. L'agent du serveur (deploiement/) tire main toutes les 5 minutes, attend la CI, déploie, puis publie
# son résultat dans etat.json sur la branche « deploiements » : rien ne peut pousser dans le serveur, donc
# aucun secret ici. Ce workflow montre ce résultat sur GitHub :
#   - déploiement dans l'environnement « production » (page du dépôt > Deployments) ;
#   - statut « deploiement/serveur » sur le commit ;
#   - issue « Déploiement bloqué sur le serveur » tant que le dernier déploiement échoue.
# Après un push sur main, il attend le rapport du serveur (15 minutes au plus). Toutes les 15 minutes, il se
# synchronise aussi pour les fusions automatiques, qui ne déclenchent pas de push.
name: CD

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: true

jobs:
  production:
    name: Déploiement sur le serveur
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      statuses: write
      issues: write
    steps:
      - name: Résultat du serveur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # pas de checkout : gh doit savoir quel dépôt viser
          DEPOT: ${{ github.repository }}
          ATTENDU: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          journal="https://github.com/$DEPOT/blob/deploiements/etat.json"

          lire() {
            gh api "repos/$DEPOT/contents/etat.json?ref=deploiements" --jq .content 2>/dev/null | base64 -d >etat.json
          }

          # marque <commit> <success|failure|error|in_progress> <description> : déploiement « production »
          marque() {
            local sha=$1 etat=$2 desc=${3:0:139} id dernier
            id=$(gh api "repos/$DEPOT/deployments?sha=$sha&environment=production" --jq '.[0].id // empty')
            if [ -z "$id" ]; then
              id=$(jq -n --arg ref "$sha" '{ref: $ref, environment: "production", auto_merge: false,
                required_contexts: [], description: "Agent du serveur"}' |
                gh api -X POST "repos/$DEPOT/deployments" --input - --jq .id)
            fi
            dernier=$(gh api "repos/$DEPOT/deployments/$id/statuses?per_page=1" --jq '.[0] | "\(.state) \(.description)"')
            if [ "$dernier" != "$etat $desc" ]; then
              jq -n --arg state "$etat" --arg desc "$desc" --arg log "$journal" \
                '{state: $state, description: $desc, log_url: $log, auto_inactive: true}' |
                gh api -X POST "repos/$DEPOT/deployments/$id/statuses" --input - >/dev/null
              echo "production ${sha:0:7} : $etat ($desc)"
            fi
          }

          # Après un push : attend que le serveur ait traité ce commit (déployé, rien à faire, échec ou refus)
          if [ -n "$ATTENDU" ]; then
            marque "$ATTENDU" in_progress "En attente de la CI puis de l'agent du serveur"
            for _ in $(seq 1 30); do
              if lire && [ "$(jq -r .sha etat.json)" = "$ATTENDU" ] && [ "$(jq -r .resultat etat.json)" != attente ]; then
                break
              fi
              sleep 30
            done
            if [ "$(jq -r '.sha // ""' etat.json 2>/dev/null)" != "$ATTENDU" ]; then
              marque "$ATTENDU" error "Le serveur n'a pas traité ce commit en 15 minutes"
            fi
          fi

          if ! lire; then
            echo "Pas encore de rapport du serveur."; exit 0
          fi
          sha=$(jq -r '.sha // ""' etat.json)
          resultat=$(jq -r '.resultat // ""' etat.json)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "etat.json invalide"; exit 1; }
          case $resultat in
            succes) etat=success ;;
            attente) etat=pending ;;
            echec | refuse) etat=failure ;;
            *) echo "Résultat inconnu : $resultat"; exit 1 ;;
          esac
          description=$(jq -r '.message // ""' etat.json | tr -d '\n' | cut -c1-139)

          # Statut sur le commit
          actuel=$(gh api "repos/$DEPOT/commits/$sha/status" \
            --jq '[.statuses[] | select(.context == "deploiement/serveur")][0] | "\(.state) \(.description)"')
          if [ "$actuel" != "$etat $description" ]; then
            gh api -X POST "repos/$DEPOT/statuses/$sha" -f state="$etat" -f context=deploiement/serveur \
              -f description="$description" -f target_url="$journal" >/dev/null
          fi

          # Déploiement « production »
          case $etat in
            success) marque "$sha" success "$description" ;;
            failure) marque "$sha" failure "$description" ;;
            pending) marque "$sha" in_progress "$description" ;;
          esac

          # Issue tant que le dernier déploiement échoue
          titre="Déploiement bloqué sur le serveur"
          num=$(gh issue list --state open --label deploiement --json number,title \
            --jq "map(select(.title == \"$titre\"))[0].number // empty")
          if [ "$etat" = failure ]; then
            {
              echo "Le serveur n'a pas déployé \`${sha:0:7}\` ($resultat) : $(jq -r .message etat.json)"
              echo
              echo '```'
              jq -r '.details // ""' etat.json | head -n 60
              echo '```'
              echo
              echo "Rapport du $(jq -r .date etat.json). Journal complet : \`journalctl -u deploiement-stack\` sur le serveur."
            } >corps.md
            if [ -z "$num" ]; then
              gh issue create --title "$titre" --label deploiement --body-file corps.md
            else
              dernier=$(gh issue view "$num" --json body,comments --jq '(.comments | last | .body) // .body')
              if [ "$dernier" != "$(cat corps.md)" ]; then gh issue comment "$num" --body-file corps.md; fi
            fi
          elif [ "$etat" = success ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "Réglé : \`${sha:0:7}\` est déployé."
          fi
